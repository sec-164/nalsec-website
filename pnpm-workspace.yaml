allowBuilds:
  esbuild: false
  workerd: true
# 依存解決の上書き(pnpm 12 は package.json の "pnpm" フィールドを読まないのでここに置く)
overrides:
  # @astrojs/check -> @astrojs/language-server -> @astrojs/astro2tsx@0.1.3 -> @napi-rs/wasm-runtime@1.2.4
  # の経路で @emnapi/runtime が 2.0.0-beta.2 に解決され、@emnapi/core 1.11.x と不整合になって
  # astro check が起動しない (TypeError: this.bridge.setLastError is not a function)。
  # 上流 (@astrojs/check / astro2tsx) が安定版に揃えたら、この行を削除して pnpm install し直す。
  "@emnapi/runtime": 1.11.3
